<svg xmlns="http://www.w3.org/2000/svg" width="2304" height="1856" viewBox="0 -320 2304 1856">
  <title>Old Town exterior generation mask v2</title>
  <desc>
    Clean 18x12 production mask at 128px per tile plus 320px north overscan. The logical
    world crop is y=0..1536. Foreground boundary roofs are off-map visual masses; the
    central three-tile road and the south branch remain walkable. No QA grid, status FX,
    baked glow, long shadow, UI, or character is present in this conditioning image.
  </desc>

  <!-- Ground. Exact logical map is retained; low-contrast seams are not diagnostics. -->
  <rect x="0" y="-320" width="2304" height="1856" fill="#536c45"/>
  <g fill="#896e49">
    <rect x="640" y="384" width="256" height="128"/>
    <rect x="1408" y="384" width="128" height="128"/>
    <rect x="512" y="512" width="128" height="384"/>
    <rect x="1536" y="512" width="128" height="128"/>
    <rect x="1920" y="640" width="128" height="256"/>
    <rect x="0" y="896" width="640" height="128"/>
    <rect x="1536" y="896" width="768" height="128"/>
    <rect x="0" y="1408" width="1024" height="128"/>
    <rect x="1280" y="1408" width="1024" height="128"/>
  </g>
  <rect x="640" y="512" width="896" height="512" fill="#918f80"/>
  <rect x="0" y="1024" width="2304" height="384" fill="#686d70"/>
  <rect x="1024" y="1408" width="256" height="128" fill="#686d70"/>

  <!-- Walkable plaza articulation: flush organic planting mosaic and edge steps are decals. -->
  <g id="plaza-decals" fill="none">
    <path d="M804 708 C816 612 884 566 968 578 C1046 548 1114 608 1110 692 C1144 774 1078 850 986 838 C902 872 816 820 804 708 Z" fill="#667b4d" stroke="#7f765c" stroke-width="26"/>
    <path d="M832 688 C860 642 906 630 946 650 C978 610 1032 614 1054 660 C1090 682 1084 734 1052 754 C1028 806 970 810 938 776 C890 802 842 770 832 724 Z" fill="#526f43"/>
    <g fill="#a15a68" stroke="#36543a" stroke-width="5">
      <circle cx="874" cy="684" r="18"/><circle cx="906" cy="704" r="14"/><circle cx="960" cy="660" r="16"/>
      <circle cx="1018" cy="694" r="19"/><circle cx="1062" cy="730" r="15"/><circle cx="982" cy="764" r="17"/>
      <circle cx="914" cy="754" r="13"/>
    </g>
    <g fill="#c49c51" stroke="#36543a" stroke-width="4">
      <circle cx="894" cy="730" r="10"/><circle cx="1038" cy="650" r="11"/><circle cx="1040" cy="772" r="10"/>
    </g>
    <path d="M660 996 H1516 M680 976 H1496" stroke="#77786f" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Exact exterior decoration prefabs, drawn as unlit non-colliding decals. -->
  <g id="exterior-decorations" stroke="#36543a" stroke-width="4">
    <g transform="translate(576 320)" fill="#9b4f65"><circle cx="-14" cy="4" r="12"/><circle cx="6" cy="-7" r="11"/><circle cx="18" cy="10" r="10"/></g>
    <g transform="translate(64 704)" fill="#9b4f65"><circle cx="-14" cy="4" r="12"/><circle cx="6" cy="-7" r="11"/><circle cx="18" cy="10" r="10"/></g>
    <g transform="translate(1472 320)" fill="#c49c51"><circle cx="-14" cy="4" r="12"/><circle cx="6" cy="-7" r="11"/><circle cx="18" cy="10" r="10"/></g>
    <g transform="translate(2240 832)" fill="#8c68a6"><circle cx="-14" cy="4" r="12"/><circle cx="6" cy="-7" r="11"/><circle cx="18" cy="10" r="10"/></g>
  </g>
  <g id="exterior-pebbles" fill="#aaa596" stroke="#595f59" stroke-width="4">
    <g transform="translate(576 960)"><ellipse cx="-14" cy="4" rx="15" ry="9"/><ellipse cx="14" cy="-5" rx="12" ry="8"/></g>
    <g transform="translate(960 1472)"><ellipse cx="-14" cy="4" rx="15" ry="9"/><ellipse cx="14" cy="-5" rx="12" ry="8"/></g>
    <g transform="translate(1600 576)"><ellipse cx="-14" cy="4" rx="15" ry="9"/><ellipse cx="14" cy="-5" rx="12" ry="8"/></g>
    <g transform="translate(1984 832)"><ellipse cx="-14" cy="4" rx="15" ry="9"/><ellipse cx="14" cy="-5" rx="12" ry="8"/></g>
  </g>

  <!-- Distant vegetation, ordered behind all building anchors. -->
  <g stroke="#28452e" stroke-width="8">
    <g><rect x="174" y="188" width="36" height="80" fill="#644a35"/><ellipse cx="192" cy="126" rx="150" ry="126" fill="#315a38"/></g>
    <g><rect x="430" y="190" width="36" height="80" fill="#644a35"/><ellipse cx="384" cy="128" rx="120" ry="120" fill="#3d6841"/></g>
