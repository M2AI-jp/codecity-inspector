    <g><rect x="1582" y="190" width="36" height="80" fill="#644a35"/><ellipse cx="1536" cy="128" rx="120" ry="120" fill="#3d6841"/></g>
    <g><rect x="2094" y="60" width="36" height="80" fill="#644a35"/><ellipse cx="2112" cy="62" rx="72" ry="112" fill="#477247"/></g>
  </g>

