  <g id="boundary-house-sw-a" stroke="#182733" stroke-width="10">
    <path d="M-18 1536 V1450 L96 1282 L254 1450 V1536 Z" fill="#263f52"/>
    <rect x="0" y="1460" width="246" height="76" fill="#66503f"/>
