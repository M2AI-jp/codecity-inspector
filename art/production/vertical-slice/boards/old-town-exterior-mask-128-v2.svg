  </g>
  <g id="boundary-tree-sw" fill="#315a38" stroke="#28452e" stroke-width="8"><ellipse cx="760" cy="1450" rx="92" ry="92"/></g>
  <g id="boundary-house-se-a" stroke="#182733" stroke-width="10">
    <path d="M1710 1536 V1440 L1840 1268 L1984 1440 V1536 Z" fill="#30495a"/>
    <rect x="1728" y="1460" width="238" height="76" fill="#6d5540"/>
  </g>
  <g id="boundary-house-se-b" stroke="#182733" stroke-width="10">
