    <path d="M112 608 L320 256 L528 608 L512 652 L128 652 Z" fill="#2c475a" stroke="#182733" stroke-width="12"/>
    <path d="M268 432 L384 296 L528 516 L512 610 L358 492 Z" fill="#35586c" stroke="#182733" stroke-width="9"/>
    <rect x="256" y="608" width="128" height="288" rx="42" fill="#62402d" stroke="#25272b" stroke-width="10"/>
    <rect x="168" y="672" width="66" height="84" fill="#31404a" stroke="#27313a" stroke-width="8"/>
    <rect x="406" y="672" width="66" height="84" fill="#31404a" stroke="#27313a" stroke-width="8"/>
    <rect x="380" y="626" width="104" height="64" rx="8" fill="#30465d" stroke="#27313a" stroke-width="7"/>
    <g fill="#8d7441" stroke="#342f28" stroke-width="6"><circle cx="228" cy="700" r="15"/><path d="M228 715 V750"/></g>
  </g>
  <g id="house-m">
    <rect x="1536" y="576" width="384" height="320" fill="#6d5848" stroke="#27313a" stroke-width="10"/>
    <path d="M1520 610 L1728 288 L1936 610 L1920 652 L1536 652 Z" fill="#304b58" stroke="#182733" stroke-width="12"/>
    <path d="M1652 478 L1772 326 L1904 526 L1888 610 L1740 482 Z" fill="#395866" stroke="#182733" stroke-width="9"/>
    <rect x="1664" y="608" width="128" height="288" rx="42" fill="#62402d" stroke="#25272b" stroke-width="10"/>
    <rect x="1584" y="672" width="72" height="84" fill="#31404a" stroke="#27313a" stroke-width="8"/>
    <rect x="1840" y="672" width="72" height="84" fill="#31404a" stroke="#27313a" stroke-width="8"/>
    <g fill="#8d7441" stroke="#342f28" stroke-width="6"><circle cx="1818" cy="700" r="15"/><path d="M1818 715 V750"/></g>
  </g>

  <!-- Repositionable world props; their exact anchors match the slice. -->
  <g stroke="#342c24" stroke-width="7">
    <circle cx="1472" cy="576" r="58" fill="#737d80"/><circle cx="1472" cy="576" r="30" fill="#304956"/>
    <rect x="780" y="946" width="120" height="42" rx="9" fill="#765639"/>
    <rect x="1164" y="946" width="120" height="42" rx="9" fill="#765639"/>
    <rect x="664" y="934" width="58" height="76" fill="#67513b"/>
    <circle cx="576" cy="704" r="44" fill="#7b5b35"/>
    <rect x="548" y="810" width="64" height="64" fill="#876944"/>
    <rect x="1812" y="430" width="86" height="72" fill="#8f7956"/>
    <circle cx="1856" cy="576" r="32" fill="#a27d43"/>
  </g>
  <g stroke="#29313a" stroke-width="9" fill="#856d3e">
    <path d="M448 1152 V1052"/><circle cx="448" cy="1042" r="20"/>
    <path d="M1344 1152 V1052"/><circle cx="1344" cy="1042" r="20"/>
    <path d="M2112 1408 V1308"/><circle cx="2112" cy="1298" r="20"/>
  </g>

