  <g id="survey-tower">
    <rect x="1920" y="320" width="256" height="320" fill="#5b6062" stroke="#27313a" stroke-width="10"/>
    <path d="M1904 356 L2048 128 L2192 356 L2176 402 L1920 402 Z" fill="#2d4756" stroke="#182733" stroke-width="12"/>
    <rect x="1920" y="352" width="128" height="288" rx="40" fill="#4c4037" stroke="#25272b" stroke-width="10"/>
    <path d="M1908 334 L2186 382 L2154 488 L1920 444 Z" fill="#6e5c7e" stroke="#44384d" stroke-width="8"/>
  </g>

