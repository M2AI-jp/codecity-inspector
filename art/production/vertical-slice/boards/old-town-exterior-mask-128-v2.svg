    <path d="M872 188 L982 -96 L1082 34 L1152 -92 L1222 34 L1322 -96 L1432 188 L1408 254 L896 254 Z" fill="#253e51" stroke="#182733" stroke-width="12"/>
    <path d="M914 206 L1000 -34 L1100 124 L1152 44 L1204 124 L1304 -34 L1390 206 Z" fill="#304d60" stroke="#182733" stroke-width="10"/>
    <circle cx="1152" cy="20" r="58" fill="#7d7765" stroke="#27313a" stroke-width="9"/>
    <path d="M1152 -22 V20 L1182 42 M1115 72 H1189" fill="none" stroke="#30343a" stroke-width="8" stroke-linecap="round"/>
    <rect x="1024" y="224" width="128" height="288" rx="44" fill="#62412f" stroke="#25272b" stroke-width="10"/>
    <rect x="944" y="330" width="64" height="90" fill="#31404a" stroke="#27313a" stroke-width="8"/>
    <rect x="1296" y="330" width="64" height="90" fill="#31404a" stroke="#27313a" stroke-width="8"/>
