    <rect x="2064" y="1460" width="240" height="76" fill="#66503f"/>
  </g>
  <g id="boundary-tree-se" fill="#315a38" stroke="#28452e" stroke-width="8"><ellipse cx="1560" cy="1446" rx="92" ry="92"/></g>
