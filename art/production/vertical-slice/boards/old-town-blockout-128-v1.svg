<svg xmlns="http://www.w3.org/2000/svg" width="2304" height="1536" viewBox="0 0 2304 1536">
  <defs>
    <pattern id="grid" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M 128 0 L 0 0 0 128" fill="none" stroke="#101820" stroke-opacity="0.28" stroke-width="4"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="2" flood-color="#111318" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ground: the exact 18x12 Fable5VerticalSlice tile map at 128px/tile. -->
  <rect width="2304" height="1536" fill="#587044"/>

  <!-- Dirt fringe and paths. -->
  <g fill="#8d7049">
    <rect x="640" y="384" width="256" height="128"/>
    <rect x="1408" y="384" width="128" height="128"/>
    <rect x="512" y="512" width="128" height="384"/>
    <rect x="1536" y="512" width="128" height="128"/>
    <rect x="1920" y="640" width="128" height="256"/>
    <rect x="0" y="896" width="640" height="128"/>
    <rect x="1536" y="896" width="768" height="128"/>
    <rect x="0" y="1408" width="1024" height="128"/>
    <rect x="1280" y="1408" width="1024" height="128"/>
  </g>

  <!-- Plaza and three-tile primary road. -->
  <rect x="640" y="512" width="896" height="512" fill="#a9a89a"/>
  <rect x="0" y="1024" width="2304" height="384" fill="#777c80"/>
  <rect x="1024" y="1408" width="256" height="128" fill="#777c80"/>

  <!-- Building footprint cells remain explicit under the visible building prisms. -->
  <rect x="896" y="0" width="512" height="512" fill="#5d6170" fill-opacity="0.52" stroke="#d9b968" stroke-width="8"/>
  <rect x="128" y="512" width="384" height="384" fill="#665a52" fill-opacity="0.52" stroke="#d9b968" stroke-width="8"/>
  <rect x="1536" y="640" width="384" height="256" fill="#665a52" fill-opacity="0.52" stroke="#d9b968" stroke-width="8"/>
  <rect x="1920" y="384" width="256" height="256" fill="#505966" fill-opacity="0.52" stroke="#d9b968" stroke-width="8"/>

  <!-- Town hall: L footprint 4x4, south anchor y=512, wall band 320px, landmark roof. -->
  <g filter="url(#soft-shadow)">
    <rect x="896" y="192" width="512" height="320" rx="8" fill="#7f756a" stroke="#25313b" stroke-width="12"/>
    <polygon points="880,210 1008,74 1144,176 1280,42 1424,210 1408,260 896,260" fill="#263d50" stroke="#17232d" stroke-width="14"/>
    <polygon points="1008,220 1152,70 1296,220" fill="#304a5b" stroke="#17232d" stroke-width="12"/>
    <circle cx="1152" cy="194" r="42" fill="#c9b56e" stroke="#27323b" stroke-width="10"/>
    <rect x="1088" y="328" width="128" height="184" rx="48" fill="#71472d" stroke="#27262a" stroke-width="12"/>
    <rect x="944" y="330" width="72" height="92" fill="#d8a54c" stroke="#27323b" stroke-width="10"/>
    <rect x="1288" y="330" width="72" height="92" fill="#d8a54c" stroke="#27323b" stroke-width="10"/>
    <rect x="992" y="474" width="320" height="38" fill="#91877b" stroke="#26313b" stroke-width="8"/>
  </g>

  <!-- Inn: M footprint 3x3, south anchor y=896, warm timber identity. -->
  <g filter="url(#soft-shadow)">
    <rect x="128" y="576" width="384" height="320" rx="8" fill="#76573e" stroke="#27313a" stroke-width="12"/>
    <polygon points="112,608 320,326 528,608 512,648 128,648" fill="#2e4658" stroke="#17232d" stroke-width="14"/>
    <polygon points="272,420 384,330 528,520 512,610 360,492" fill="#36566a" stroke="#17232d" stroke-width="10"/>
    <rect x="256" y="712" width="128" height="184" rx="40" fill="#724129" stroke="#292629" stroke-width="12"/>
    <rect x="168" y="672" width="66" height="84" fill="#d8a54c" stroke="#27323b" stroke-width="10"/>
    <rect x="406" y="672" width="66" height="84" fill="#d8a54c" stroke="#27323b" stroke-width="10"/>
    <rect x="380" y="626" width="104" height="64" rx="8" fill="#314b6b" stroke="#d9b968" stroke-width="8"/>
  </g>

  <!-- Medium house: 3x2 footprint, south anchor y=896. -->
  <g filter="url(#soft-shadow)">
    <rect x="1536" y="576" width="384" height="320" rx="8" fill="#725c49" stroke="#27313a" stroke-width="12"/>
    <polygon points="1520,610 1728,350 1936,610 1920,650 1536,650" fill="#334a55" stroke="#17232d" stroke-width="14"/>
    <polygon points="1652,480 1772,372 1904,526 1888,610 1740,482" fill="#3b5661" stroke="#17232d" stroke-width="10"/>
    <rect x="1728" y="712" width="128" height="184" rx="38" fill="#71452d" stroke="#292629" stroke-width="12"/>
    <rect x="1584" y="672" width="72" height="84" fill="#d8a54c" stroke="#27323b" stroke-width="10"/>
    <rect x="1870" y="672" width="42" height="84" fill="#d8a54c" stroke="#27323b" stroke-width="10"/>
  </g>

  <!-- Survey tower: S footprint 2x2, south anchor y=640, vacant and tarp-marked. -->
  <g filter="url(#soft-shadow)">
    <rect x="1920" y="320" width="256" height="320" rx="8" fill="#5f6467" stroke="#27313a" stroke-width="12"/>
    <polygon points="1904,356 2048,136 2192,356 2176,398 1920,398" fill="#2f4654" stroke="#17232d" stroke-width="14"/>
    <rect x="1984" y="456" width="128" height="184" rx="36" fill="#4c4037" stroke="#292629" stroke-width="12"/>
    <polygon points="1908,334 2186,382 2154,488 1920,444" fill="#746086" fill-opacity="0.9" stroke="#44344f" stroke-width="10"/>
  </g>

  <!-- Door tiles and exterior entrance cells. -->
  <g stroke="#342c20" stroke-width="8">
    <rect x="1024" y="384" width="128" height="128" fill="#c8783f"/>
    <rect x="256" y="768" width="128" height="128" fill="#c8783f"/>
    <rect x="1664" y="768" width="128" height="128" fill="#c8783f"/>
    <rect x="1920" y="512" width="128" height="128" fill="#6c5551"/>
  </g>
  <g fill="#d7bd65" fill-opacity="0.72" stroke="#6c5726" stroke-width="8">
    <rect x="1024" y="512" width="128" height="128"/>
    <rect x="256" y="896" width="128" height="128"/>
    <rect x="1664" y="896" width="128" height="128"/>
    <rect x="1920" y="640" width="128" height="128"/>
  </g>

  <!-- Trees: trunks are world anchors; canopies are large overhead masses. -->
  <g stroke="#203324" stroke-width="10" filter="url(#soft-shadow)">
    <g><rect x="174" y="188" width="36" height="80" fill="#72543c"/><ellipse cx="192" cy="126" rx="150" ry="126" fill="#345b37"/></g>
    <g><rect x="430" y="190" width="36" height="80" fill="#72543c"/><ellipse cx="448" cy="140" rx="110" ry="112" fill="#416a3f"/></g>
    <g><rect x="686" y="318" width="36" height="80" fill="#72543c"/><ellipse cx="704" cy="246" rx="72" ry="112" fill="#4b7445"/></g>
    <g><rect x="1838" y="188" width="36" height="80" fill="#72543c"/><ellipse cx="1856" cy="126" rx="150" ry="126" fill="#345b37"/></g>
    <g><rect x="1582" y="190" width="36" height="80" fill="#72543c"/><ellipse cx="1600" cy="140" rx="110" ry="112" fill="#416a3f"/></g>
    <g><rect x="2094" y="60" width="36" height="80" fill="#72543c"/><ellipse cx="2112" cy="62" rx="72" ry="112" fill="#4b7445"/></g>
  </g>

  <!-- Plaza and street props. -->
  <g stroke="#342c24" stroke-width="8" filter="url(#soft-shadow)">
    <circle cx="1472" cy="576" r="58" fill="#748087"/><circle cx="1472" cy="576" r="30" fill="#304d61"/>
    <rect x="780" y="946" width="120" height="42" rx="10" fill="#79583a"/>
    <rect x="1164" y="946" width="120" height="42" rx="10" fill="#79583a"/>
    <rect x="664" y="934" width="58" height="76" fill="#68533b"/>
    <circle cx="576" cy="704" r="44" fill="#7f5d35"/>
    <rect x="548" y="810" width="64" height="64" fill="#8c6b44"/>
    <rect x="1812" y="430" width="86" height="72" fill="#9a8058" stroke-dasharray="14 8"/>
    <circle cx="1856" cy="576" r="32" fill="#d0953f"/>
  </g>

  <!-- Streetlights sit on edge lanes; central lane remains clear. -->
  <g stroke="#292f35" stroke-width="10" fill="#d4a24b" filter="url(#soft-shadow)">
    <path d="M448 1152 V1052"/><circle cx="448" cy="1042" r="22"/>
    <path d="M1344 1152 V1052"/><circle cx="1344" cy="1042" r="22"/>
    <path d="M2112 1408 V1308"/><circle cx="2112" cy="1298" r="22"/>
  </g>

  <!-- Floral and pebble overlays at exact coordinates. -->
  <g fill="#b65a6f" stroke="#44603c" stroke-width="4">
    <circle cx="576" cy="320" r="26"/><circle cx="64" cy="704" r="26"/>
    <circle cx="1472" cy="320" r="26" fill="#d1a75b"/>
    <circle cx="2240" cy="832" r="26" fill="#9a73b4"/>
  </g>
  <g fill="#b7b0a0" stroke="#5e625d" stroke-width="5">
    <ellipse cx="576" cy="960" rx="28" ry="18"/><ellipse cx="960" cy="1472" rx="28" ry="18"/>
    <ellipse cx="1600" cy="576" rx="28" ry="18"/><ellipse cx="1984" cy="832" rx="28" ry="18"/>
  </g>

  <!-- Characters: distinct role colors and exact anchors. -->
  <g stroke="#202730" stroke-width="8" filter="url(#soft-shadow)">
    <g transform="translate(320 848)"><circle cx="0" cy="-62" r="24" fill="#d8ad80"/><path d="M-34,-42 L34,-42 26,36 -26,36 Z" fill="#2f6378"/><rect x="-42" y="-76" width="84" height="18" rx="8" fill="#274d65"/></g>
    <g transform="translate(1216 592)"><circle cx="0" cy="-62" r="24" fill="#d8ad80"/><path d="M-34,-42 L34,-42 26,36 -26,36 Z" fill="#735f88"/></g>
    <g transform="translate(704 1232)"><circle cx="0" cy="-62" r="24" fill="#c9906e"/><path d="M-34,-42 L34,-42 26,36 -26,36 Z" fill="#556b43"/></g>
    <g transform="translate(320 592)"><circle cx="0" cy="-62" r="24" fill="#d8a37d"/><path d="M-34,-42 L34,-42 26,36 -26,36 Z" fill="#8a4f45"/></g>
  </g>

  <!-- Interaction/status effects remain separate visual overlays. -->
  <g fill="none" stroke-width="10">
    <ellipse cx="1088" cy="448" rx="46" ry="22" stroke="#e6d36e"/>
    <ellipse cx="320" cy="832" rx="46" ry="22" stroke="#e6d36e"/>
    <ellipse cx="1728" cy="832" rx="46" ry="22" stroke="#e6d36e"/>
    <ellipse cx="2048" cy="472" rx="154" ry="170" stroke="#8798ac" stroke-dasharray="18 14"/>
    <circle cx="1152" cy="112" r="58" stroke="#85b56a"/>
  </g>

  <!-- Grid is last so every placement remains inspectable before image generation. -->
  <rect width="2304" height="1536" fill="url(#grid)"/>
  <rect x="4" y="4" width="2296" height="1528" fill="none" stroke="#15212a" stroke-width="8"/>
</svg>
