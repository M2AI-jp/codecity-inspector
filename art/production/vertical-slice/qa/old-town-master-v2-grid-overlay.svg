  </g>
  <g transform="translate(12 980)">
    <rect x="0" y="0" width="640" height="32" rx="4" fill="#071019" fill-opacity="0.82" stroke="#7de9ff"/>
    <text x="10" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ecfbff">QA GRID ONLY · 64px cells · no geometry/collision approval implied</text>
