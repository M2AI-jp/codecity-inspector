    <text x="800" y="18">x12</text><text x="864" y="18">x13</text><text x="928" y="18">x14</text><text x="992" y="18">x15</text>
    <text x="1056" y="18">x16</text><text x="1120" y="18">x17</text><text x="1184" y="18">x18</text><text x="1248" y="18">x19</text>
    <text x="1312" y="18">x20</text><text x="1376" y="18">x21</text><text x="1440" y="18">x22</text><text x="1504" y="18">x23</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ecfbff" text-anchor="start" filter="url(#label-shadow)">
    <text x="5" y="39">y0</text><text x="5" y="103">y1</text><text x="5" y="167">y2</text><text x="5" y="231">y3</text>
