<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7de9ff" stroke-width="1" stroke-opacity="0.72"/>
    </pattern>
    <filter id="label-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1" result="outline"/>
      <feFlood flood-color="#071019" flood-opacity="0.95" result="color"/>
      <feComposite in="color" in2="outline" operator="in" result="stroke"/>
      <feMerge><feMergeNode in="stroke"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image x="0" y="0" width="1536" height="1024" xlink:href="../boards/old-town-exterior-master-v1.png"/>
  <rect x="0" y="0" width="1536" height="1024" fill="url(#grid)"/>
  <rect x="1" y="1" width="1534" height="1022" fill="none" stroke="#7de9ff" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ecfbff" text-anchor="middle" filter="url(#label-shadow)">
    <text x="32" y="18">x0</text><text x="96" y="18">x1</text><text x="160" y="18">x2</text><text x="224" y="18">x3</text>
