<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="1120" viewBox="0 0 1600 1120"
     role="img" aria-labelledby="title desc">
  <title id="title">Inn n=1 minimal-delta contact sheet</title>
  <desc id="desc">Coordinate audit for the accepted full background, inn crop, door plate, foreground alpha crop, and courtyard repair envelope.</desc>
  <defs>
    <style>
      .bg { fill: #111722; }
      .panel { fill: #18212e; stroke: #53657a; stroke-width: 2; }
      .title { fill: #f6f0da; font: 700 28px system-ui, sans-serif; }
      .h2 { fill: #f6f0da; font: 700 18px system-ui, sans-serif; }
      .label { fill: #cdd8e5; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .small { fill: #aebdd0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .lot { fill: none; stroke: #ffd166; stroke-width: 4; }
      .visual { fill: none; stroke: #55d6be; stroke-width: 4; }
      .door { fill: rgba(91, 192, 235, 0.22); stroke: #5bc0eb; stroke-width: 4; }
      .trigger { fill: rgba(255, 255, 255, 0.2); stroke: #ffffff; stroke-width: 3; stroke-dasharray: 8 6; }
      .repair { fill: rgba(255, 91, 146, 0.25); stroke: #ff5b92; stroke-width: 4; }
      .anchor { fill: #ffffff; stroke: #111722; stroke-width: 2; }
      .fail { fill: #ff8b8b; font: 700 14px system-ui, sans-serif; }
      .pass { fill: #8af0bd; font: 700 14px system-ui, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text class="title" x="32" y="42">Inn n=1 — accepted background + smallest honest runtime deltas</text>

  <rect class="panel" x="24" y="60" width="792" height="564" rx="8"/>
  <text class="h2" x="40" y="88">A. Full accepted master at 50% — runtime background remains intact</text>
  <image href="../../boards/old-town-exterior-master-v1.png"
         xlink:href="../../boards/old-town-exterior-master-v1.png"
         x="32" y="104" width="768" height="512" preserveAspectRatio="none"/>
  <g transform="translate(32 104) scale(0.5)">
    <rect class="lot" x="47" y="179" width="384" height="354"/>
    <rect class="visual" x="73" y="179" width="357" height="296"/>
    <rect class="door" x="185" y="356" width="43" height="83"/>
    <rect class="trigger" x="184" y="430" width="48" height="24"/>
    <rect class="repair" x="267" y="431" width="91" height="83"/>
    <circle class="anchor" cx="207" cy="480" r="8"/>
  </g>
  <text class="small" x="40" y="612">yellow lot · teal occluder crop · blue door · white trigger · pink 18px repair · dot approach (207,480)</text>

  <rect class="panel" x="832" y="60" width="400" height="408" rx="8"/>
  <text class="h2" x="848" y="88">B. Interaction crop — exact 384×354</text>
  <svg x="840" y="104" width="384" height="354" viewBox="47 179 384 354" preserveAspectRatio="none">
    <image href="../../boards/old-town-exterior-master-v1.png"
           xlink:href="../../boards/old-town-exterior-master-v1.png"
           x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"/>
  </svg>
  <rect class="lot" x="840" y="104" width="384" height="354"/>

  <rect class="panel" x="832" y="480" width="400" height="346" rx="8"/>
  <text class="h2" x="848" y="508">C. Foreground source crop — 357×296</text>
  <svg x="848" y="524" width="357" height="296" viewBox="73 179 357 296" preserveAspectRatio="none">
    <image href="../../boards/old-town-exterior-master-v1.png"
           xlink:href="../../boards/old-town-exterior-master-v1.png"
           x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"/>
  </svg>
  <rect class="visual" x="848" y="524" width="357" height="296"/>
  <text class="fail" x="848" y="848">PENDING: RGB crop is not an occluder until its building silhouette is pixel-tight RGBA.</text>

  <rect class="panel" x="1248" y="60" width="328" height="328" rx="8"/>
  <text class="h2" x="1264" y="88">D. Closed door plate — 2× preview</text>
  <svg x="1348" y="104" width="128" height="224" viewBox="176 336 64 112" preserveAspectRatio="none">
    <image href="../../boards/old-town-exterior-master-v1.png"
           xlink:href="../../boards/old-town-exterior-master-v1.png"
           x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"/>
  </svg>
  <rect class="door" x="1348" y="104" width="128" height="224"/>
  <text class="pass" x="1264" y="352">READY: exact source view; place at world (176,336), never scale the asset itself.</text>

  <rect class="panel" x="1248" y="404" width="328" height="422" rx="8"/>
  <text class="h2" x="1264" y="432">E. Courtyard repair envelope — 3×</text>
  <svg x="1272" y="448" width="273" height="249" viewBox="267 431 91 83" preserveAspectRatio="none">
    <image href="../../boards/old-town-exterior-master-v1.png"
           xlink:href="../../boards/old-town-exterior-master-v1.png"
           x="0" y="0" width="1536" height="1024" preserveAspectRatio="none"/>
  </svg>
  <rect class="repair" x="1272" y="448" width="273" height="249"/>
  <line x1="1272" y1="502" x2="1545" y2="502" stroke="#ffd166" stroke-width="4" stroke-dasharray="9 6"/>
  <line x1="1272" y1="697" x2="1545" y2="697" stroke="#ffd166" stroke-width="4"/>
  <text class="small" x="1264" y="724">source cluster y=449..514 → target y=431..496</text>
  <text class="small" x="1264" y="744">exact delta (0,-18); clear route begins at world y=496</text>
  <text class="fail" x="1264" y="772">PENDING: segment cluster, rebuild hidden cobble, then composite deterministically.</text>

  <rect class="panel" x="24" y="644" width="792" height="440" rx="8"/>
  <text class="h2" x="40" y="674">F. Required runtime ordering</text>
  <text class="label" x="56" y="710">00  full accepted background (1536×1024, world 0,0)</text>
  <text class="label" x="56" y="742">05  courtyard repair plate (91×83, world 267,431)</text>
  <text class="label" x="56" y="774">10  cutaway background/interior below actors; fully cover baked exterior</text>
  <text class="label" x="56" y="806">15  exactly one exterior door state (64×112, world 176,336)</text>
  <text class="label" x="56" y="838">20  player / NPC actors</text>
  <text class="label" x="56" y="870">30/35  exterior occluder OR interior foreground rim above actors, never both</text>
  <text class="h2" x="40" y="920">Hard failures</text>
  <text class="fail" x="56" y="952">opaque rectangular occluder · black open-door hole · collision from bbox</text>
  <text class="fail" x="56" y="980">cluster left at old y · any resampling · visible crop/repair seam</text>
  <text class="fail" x="56" y="1008">calling n=1 complete without interior, NPC, exit and uninterrupted browser proof</text>
  <text class="small" x="40" y="1052">Coordinates are half-open world pixels. Review actual assets at 100%; this sheet is deliberately downscaled in panel A.</text>

  <rect class="panel" x="832" y="872" width="744" height="212" rx="8"/>
  <text class="h2" x="848" y="902">G. Current truth</text>
  <text class="pass" x="864" y="938">Observed: master/hash/dimensions, inn/door/cluster envelopes.</text>
  <text class="pass" x="864" y="970">Ready: deterministic interaction crop and closed-door source view.</text>
  <text class="fail" x="864" y="1002">Unknown: exact alpha, hidden cobble, open-door pixels, interior registration.</text>
  <text class="small" x="864" y="1040">Do not convert “coordinates fixed” into “art accepted.” The pending assets are visually blocking.</text>
</svg>
