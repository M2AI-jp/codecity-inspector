<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <title>CodeCity Inspector — 古町の宿屋</title>
  <link rel="stylesheet" href="/fable5-v2/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="identity">
        <span class="eyebrow">CodeCity Inspector · playable vertical slice</span>
        <strong id="repository-name">街を読み込み中</strong>
      </div>
      <div class="topbar-actions">
        <span id="asset-badge" class="status-badge" aria-live="polite">画像照合中</span>
        <span id="geometry-badge" class="status-badge">座標照合中</span>
        <div class="zoom-control" aria-label="表示倍率">
          <button id="zoom-out" type="button" aria-label="縮小">−</button>
          <output id="zoom-value" aria-live="polite">1×</output>
          <button id="zoom-in" type="button" aria-label="拡大">＋</button>
        </div>
      </div>
    </header>

    <main class="game-stage" aria-label="ユーザー提供の完成画像から作った古町のゲーム画面">
      <canvas
        id="world-canvas"
        tabindex="0"
        aria-label="古町。WASDまたは矢印キーで4方向に歩きます。宿屋の扉は近づくと自動で出入りし、Enter、Space、Eキーで会話や調査もできます。"
      >お使いのブラウザーはゲーム画面に対応していません。</canvas>

      <section class="mission-card" aria-live="polite">
        <span id="location-text">古町・中央大通り</span>
        <strong id="objective-text">西へ進み、左上の宿屋の扉へ向かう</strong>
        <small>WASD / 矢印：歩く　扉は近づくと自動で開閉　Enter / Space / E：会話・調査</small>
      </section>

      <section id="startup-panel" class="cover-panel" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="startup-message">ユーザー提供の町とゲームオブジェクトを読み込んでいます…</p>
      </section>

      <section id="game-error" class="cover-panel error-panel" role="alert" hidden>
        <span class="eyebrow">production gate</span>
        <h1>必要な画像が揃っていません</h1>
        <p id="game-error-message"></p>
        <ul id="game-error-details"></ul>
        <p class="error-note">見た目の代替物は描かず、asset contractを満たすまで開始しません。</p>
      </section>

      <section id="nearby-prompt" class="nearby-prompt" aria-live="polite" hidden>
        <span id="nearby-place"></span>
        <strong id="nearby-action"></strong>
        <kbd id="nearby-key-hint">Enter</kbd>
      </section>

      <button id="action-button" class="action-button" type="button" disabled aria-label="近くを操作する">
        <span aria-hidden="true">◎</span>
        <strong>操作</strong>
      </button>

      <nav id="dpad" class="dpad" aria-label="4方向移動">
        <button type="button" class="dpad-north" data-direction="north" aria-label="上へ歩く">▲</button>
        <button type="button" class="dpad-west" data-direction="west" aria-label="左へ歩く">◀</button>
        <button type="button" class="dpad-south" data-direction="south" aria-label="下へ歩く">▼</button>
        <button type="button" class="dpad-east" data-direction="east" aria-label="右へ歩く">▶</button>
      </nav>

      <p id="dialogue-status" class="visually-hidden" aria-live="assertive" hidden></p>
      <p id="screen-reader-status" class="visually-hidden" aria-live="polite"></p>
    </main>
  </div>

  <script type="module" src="/fable5-v2/app.js"></script>
</body>
</html>
