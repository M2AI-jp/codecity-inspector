name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: |
          mkdir -p compare/ci
          node --test test/*.test.mjs 2>&1 | tee compare/ci/tests.log

      - name: Check state detection
        if: ${{ !cancelled() }}
        run: node tools/check-state.mjs 2>&1 | tee compare/ci/state.log

      - name: Generate the town
        if: ${{ !cancelled() }}
        run: |
          {
            node --version
            git --version
            git rev-parse HEAD
            git rev-parse --short HEAD
            git status --short
          } 2>&1 | tee compare/ci/environment.log
          node codecity.mjs . --json compare/ci/town.json 2>&1 | tee compare/ci/generate.log

      - name: Check the ASCII town
        if: ${{ !cancelled() }}
        run: node tools/ascii-town.mjs compare/ci/town.json --check 2>&1 | tee compare/ci/ascii.log

      - name: Check empty lawn rectangles
        if: ${{ !cancelled() }}
        run: node tools/lawn.mjs compare/ci/town.json --max 8 2>&1 | tee compare/ci/lawn.log

      - name: Check playability
        if: ${{ !cancelled() }}
        run: node tools/check-play.mjs . --town-out compare/ci/play-town.json 2>&1 | tee compare/ci/play.log

      - name: Check the generated manifest
        if: ${{ !cancelled() }}
        run: |
          node tools/build-manifest.mjs 2>&1 | tee compare/ci/manifest.log
          git diff --exit-code 2>&1 | tee -a compare/ci/manifest.log

      - name: Upload the failed town and check outputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-town-${{ github.run_id }}-${{ github.run_attempt }}
          path: compare/ci/
          retention-days: 14
