name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - run: npm ci
      - run: npm ci --prefix tools/asset-forge
      - run: npm run check
      - run: npm run asset:check
