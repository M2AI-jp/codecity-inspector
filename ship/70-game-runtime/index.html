<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; worker-src 'none'">
    <title>CodeCity — 調査の街</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main id="game-app" class="game-app">
      <section class="game-shell" aria-label="CodeCity のゲーム画面">
        <canvas id="game-canvas" width="640" height="360" tabindex="0" aria-label="調査の街。矢印キーまたは WASD で移動し、Enter で調べます"></canvas>
        <div id="game-ui" class="game-ui" role="status" aria-live="polite" aria-atomic="false"></div>
        <p id="game-error" class="game-error" role="alert" hidden></p>
      </section>
    </main>
    <noscript>この街を遊ぶには JavaScript を有効にしてください。</noscript>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
